name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
      - copilot/deploy-telegram-bot
    paths:
      - '**.gs'
      - 'appsscript.json'
      - '.clasp.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Setup Clasp credentials
        env:
          CLASP_CREDS: ${{ secrets.CLASP_CREDS }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const rawSecret = (process.env.CLASP_CREDS || '').trim();
          const outputPath = path.join(process.env.HOME, '.clasprc.json');

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          if (!rawSecret) {
            fail('Brak sekretu CLASP_CREDS.');
          }

          function tryParse(value) {
            try {
              return JSON.parse(value);
            } catch {
              return null;
            }
          }

          function normalize(value) {
            let parsed = tryParse(value);
            if (typeof parsed === 'string') {
              parsed = tryParse(parsed);
            }

            if (parsed) {
              return parsed;
            }

            const decoded = Buffer.from(value, 'base64').toString('utf8').trim();
            if (!decoded || decoded === value) {
              return null;
            }

            parsed = tryParse(decoded);
            if (typeof parsed === 'string') {
              parsed = tryParse(parsed);
            }

            return parsed;
          }

          const credentials = normalize(rawSecret);

          if (!credentials) {
            fail('Sekret CLASP_CREDS musi zawierać poprawny JSON z pliku .clasprc.json (surowy lub zakodowany base64).');
          }

          const hasV3Token = credentials.tokens && typeof credentials.tokens === 'object' && credentials.tokens.default;
          const hasLegacyLocalToken = credentials.token && credentials.oauth2ClientSettings;
          const hasLegacyGlobalToken = credentials.access_token && credentials.refresh_token;
          const looksLikeOAuthClientConfig = credentials.installed || credentials.web;

          if (looksLikeOAuthClientConfig) {
            fail('Sekret CLASP_CREDS zawiera konfigurację klienta OAuth, a nie zalogowany plik .clasprc.json. Wygeneruj sekret po pełnym clasp login i wklej zawartość .clasprc.json.');
          }

          if (!hasV3Token && !hasLegacyLocalToken && !hasLegacyGlobalToken) {
            fail('Sekret CLASP_CREDS nie zawiera danych logowania clasp. Oczekiwano zawartości pliku .clasprc.json wygenerowanego po clasp login.');
          }

          fs.writeFileSync(outputPath, JSON.stringify(credentials, null, 2));
          fs.chmodSync(outputPath, 0o600);
          NODE

      - name: Deploy to Google Apps Script
        run: |
          clasp push --force

      - name: Create new deployment
        id: deployment
        run: |
          set -euo pipefail

          DEPLOY_OUTPUT="$(clasp create-deployment --description "GitHub Actions ${GITHUB_SHA}")"
          echo "${DEPLOY_OUTPUT}"

          DEPLOYMENT_ID="$(printf '%s\n' "${DEPLOY_OUTPUT}" | grep -Eo 'AKfycb[a-zA-Z0-9_-]+' | head -n 1)"
          SCRIPT_ID="$(node -p "require('./.clasp.json').scriptId")"

          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "Nie udało się odczytać Deployment ID z outputu clasp." >&2
            exit 1
          fi

          echo "deployment_id=${DEPLOYMENT_ID}" >> "${GITHUB_OUTPUT}"
          echo "script_id=${SCRIPT_ID}" >> "${GITHUB_OUTPUT}"
          echo "exec_url=https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec" >> "${GITHUB_OUTPUT}"
          echo "bot_url=https://script.google.com/macros/d/${SCRIPT_ID}/useTriggerFunction" >> "${GITHUB_OUTPUT}"

      - name: Print deployment links
        run: |
          echo "Deployment ID: ${{ steps.deployment.outputs.deployment_id }}"
          echo "Script ID: ${{ steps.deployment.outputs.script_id }}"
          echo "Web app URL: ${{ steps.deployment.outputs.exec_url }}"
          echo "Bot URL: ${{ steps.deployment.outputs.bot_url }}"
