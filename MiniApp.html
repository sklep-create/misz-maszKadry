<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pracownika</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <?!= include('Styles'); ?>
    <style>
      /* Paleta projektu (Ustawienia!KOLOR_MARKA/PRACA/UWAGA) - patrz PaletaKolorow.gs.
         Nadpisuje domyślne akcenty z Styles.html; tło/powierzchnie ciemnego
         motywu zostają bez zmian (KOLOR_TLO to jasny neutralny odcień, używany
         w PDF - nie pasuje bezpośrednio do ciemnego tła Mini App). */
      :root {
        --accent: <?= getThemeColor('MARKA') ?>;
        --start: <?= getThemeColor('PRACA') ?>;
        --stop: <?= getThemeColor('UWAGA') ?>;
      }
    </style>
  </head>
  <body>
    <main class="panel" id="employeePanel" style="display:none;">
      <img id="employeeLogo" class="company-logo" alt="Logo firmy" hidden>
      <h1>Panel Pracownika</h1>
      <p class="subtitle" id="employeeName">Rejestruj czas pracy bezpośrednio w Telegramie.</p>

      <div id="statusBadge" class="status-badge idle">⏳ Ładowanie statusu…</div>

      <div class="button-grid">
        <button id="startBtn" class="big-btn start-btn">▶️ START</button>
        <button id="stopBtn" class="big-btn stop-btn">⏹️ STOP</button>
      </div>
      <div id="status" class="status"></div>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="historia">📜 Historia</button>
        <button class="tab-btn" data-tab="grafik">📅 Grafik</button>
        <button class="tab-btn" data-tab="korekta">✏️ Korekta</button>
        <button class="tab-btn" data-tab="dyspozycyjnosc">🗓️ Dyspozycyjność</button>
      </nav>

      <section id="tab-historia" class="tab-content active">
        <div id="historyList" class="list"><p class="empty-hint">Ładowanie…</p></div>
      </section>

      <section id="tab-grafik" class="tab-content">
        <div id="scheduleList" class="list"><p class="empty-hint">Ładowanie…</p></div>
      </section>

      <section id="tab-korekta" class="tab-content">
        <form id="correctionForm" class="form">
          <label>
            Data
            <input type="date" id="corrDate" required>
          </label>
          <label>
            Godzina rozpoczęcia pracy
            <input type="time" id="corrTime" required>
          </label>
          <label>
            Opis (opcjonalnie)
            <textarea id="corrNote" rows="3" placeholder="np. zapomniałem kliknąć START"></textarea>
          </label>
          <button type="submit" id="corrSubmitBtn" class="submit-btn">Wyślij wniosek o korektę</button>
        </form>
        <div id="corrStatus" class="status"></div>
      </section>

      <section id="tab-dyspozycyjnosc" class="tab-content">
        <label style="display:block; font-size:13px; color:var(--hint);">
          Miesiąc
          <select id="availMonth" class="avail-month-select"></select>
        </label>
        <div id="availCounter" class="status-badge idle" style="margin-top:12px;">⏳ Ładowanie…</div>
        <div id="availDaysList" class="list" style="margin-top:12px;"><p class="empty-hint">Ładowanie…</p></div>
        <button id="availSaveBtn" class="submit-btn" style="margin-top:14px;">Zapisz dyspozycyjność</button>
        <div id="availStatus" class="status"></div>
      </section>
    </main>

    <main class="panel" id="employerPanel" style="display:none;">
      <img id="employerLogo" class="company-logo" alt="Logo firmy" hidden>
      <h1>Panel Pracodawcy</h1>
      <p class="subtitle">Zatwierdzaj godziny pracy pracowników.</p>

      <nav class="tabs" style="grid-template-columns: 1fr;">
        <button class="tab-btn active" type="button">✅ Zatwierdź godziny</button>
      </nav>

      <label style="display:block; font-size:13px; color:var(--hint);">
        Pracownik
        <select id="empSelect" class="avail-month-select"></select>
      </label>

      <div id="pendingList" class="list" style="margin-top:14px;"><p class="empty-hint">Wybierz pracownika…</p></div>
    </main>

    <script>
      (function () {
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        const initData = tg ? tg.initData || "" : "";

        const statusEl = document.getElementById("status");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusBadge = document.getElementById("statusBadge");
        const employeeNameEl = document.getElementById("employeeName");
        const historyList = document.getElementById("historyList");
        const scheduleList = document.getElementById("scheduleList");
        const correctionForm = document.getElementById("correctionForm");
        const corrDate = document.getElementById("corrDate");
        const corrTime = document.getElementById("corrTime");
        const corrNote = document.getElementById("corrNote");
        const corrSubmitBtn = document.getElementById("corrSubmitBtn");
        const corrStatus = document.getElementById("corrStatus");
        const availMonth = document.getElementById("availMonth");
        const availCounter = document.getElementById("availCounter");
        const availDaysList = document.getElementById("availDaysList");
        const availSaveBtn = document.getElementById("availSaveBtn");
        const availStatus = document.getElementById("availStatus");
        let availLimit = 0;

        const employeePanel = document.getElementById("employeePanel");
        const employerPanel = document.getElementById("employerPanel");
        const employeeLogo = document.getElementById("employeeLogo");
        const employerLogo = document.getElementById("employerLogo");
        const empSelect = document.getElementById("empSelect");
        const pendingList = document.getElementById("pendingList");

        const DAY_ICON = { Praca: "💼", Wolne: "🌤️", Urlop: "🏖️", Chorobowe: "🤒" };
        const DAY_NAMES = ["niedziela", "poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota"];

        if (tg) {
          tg.ready();
          tg.expand();
          applyTelegramTheme(tg.themeParams || {});
        }

        document.querySelectorAll(".tab-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
          });
        });

        corrDate.value = new Date().toISOString().slice(0, 10);

        startBtn.addEventListener("click", function () { submitEvent("START"); });
        stopBtn.addEventListener("click", function () { submitEvent("STOP"); });
        correctionForm.addEventListener("submit", function (e) {
          e.preventDefault();
          submitCorrection();
        });
        availMonth.addEventListener("change", function () {
          loadAvailability(availMonth.value);
        });
        availSaveBtn.addEventListener("click", submitAvailability);
        empSelect.addEventListener("change", function () {
          loadPending(empSelect.value);
        });
        pendingList.addEventListener("change", function (e) {
          if (e.target.classList.contains("nadgodziny-select")) {
            syncPrzepracowaneInput(e.target);
          }
        });
        pendingList.addEventListener("click", function (e) {
          if (e.target.classList.contains("approve-btn")) {
            submitApproval(e.target);
          }
        });

        loadRole();

        function loadRole() {
          callApi("getMiniAppRole", { initData: initData })
            .then(function (result) {
              if (result && result.ok && result.role === "employer") {
                renderLogo(result.logoUrl);
                employerPanel.style.display = "";
                populateEmployeeSelect(result.employees || []);
                return;
              }

              renderLogo(result && result.logoUrl);
              employeePanel.style.display = "";
              if (result && !result.ok) {
                setStatusBadge("idle", "⚠️ " + result.error);
              }
              loadDashboard();
              loadAvailability();
            })
            .catch(function () {
              employeePanel.style.display = "";
              loadDashboard();
              loadAvailability();
            });
        }

        function renderLogo(url) {
          [employeeLogo, employerLogo].forEach(function (img) {
            if (url) {
              img.src = url;
              img.hidden = false;
            } else {
              img.hidden = true;
            }
          });
        }

        function populateEmployeeSelect(employees) {
          if (!employees.length) {
            empSelect.innerHTML = '<option value="">Brak pracowników</option>';
            return;
          }

          empSelect.innerHTML = '<option value="">— wybierz —</option>' + employees.map(function (emp) {
            return '<option value="' + escapeHtml(emp.employeeId) + '">' + escapeHtml(emp.fullName) + '</option>';
          }).join("");
        }

        function loadPending(employeeId) {
          if (!employeeId) {
            pendingList.innerHTML = '<p class="empty-hint">Wybierz pracownika…</p>';
            return;
          }

          pendingList.innerHTML = '<p class="empty-hint">Ładowanie…</p>';

          callApi("getPendingAttendance", { initData: initData, employeeId: employeeId })
            .then(function (result) {
              if (!result || !result.ok) {
                pendingList.innerHTML = '<p class="empty-hint">⚠️ ' + escapeHtml((result && result.error) || "Nie udało się pobrać danych.") + '</p>';
                return;
              }

              renderPending(result.pending || [], !!result.canHaveOvertime);
            })
            .catch(function () {
              pendingList.innerHTML = '<p class="empty-hint">⚠️ Błąd połączenia z serwerem.</p>';
            });
        }

        function renderPending(pending, canHaveOvertime) {
          if (!pending.length) {
            pendingList.innerHTML = '<p class="empty-hint">Brak niezatwierdzonych dni.</p>';
            return;
          }

          const overtimeOption = canHaveOvertime
            ? '<option value="TAK">Nadgodziny (dokładny czas)</option>'
            : '';

          pendingList.innerHTML = pending.map(function (item) {
            return '<div class="attendance-item" data-log-id="' + escapeHtml(item.logId) + '">' +
              '<div class="row">' +
              '<span class="label">' + escapeHtml(item.date) + '</span>' +
              '<span class="meta">' + escapeHtml((item.start || "").slice(0, 5)) + ' – ' + escapeHtml((item.stop || "").slice(0, 5)) + ' (razem ' + escapeHtml(item.rawDuration) + ')</span>' +
              '</div>' +
              (canHaveOvertime ? '' : '<p class="empty-hint" style="text-align:left; padding:0;">ℹ️ Ten pracownik nie może mieć nadgodzin.</p>') +
              '<div class="controls">' +
              '<select class="nadgodziny-select" data-log-id="' + escapeHtml(item.logId) + '" data-standard="' + escapeHtml(item.standardHours) + '" data-raw="' + escapeHtml(item.rawDuration) + '">' +
              '<option value="NIE">Bez nadgodzin (' + escapeHtml(item.standardHours) + ')</option>' +
              overtimeOption +
              '</select>' +
              '<input type="text" class="przepracowane-input" data-log-id="' + escapeHtml(item.logId) + '" value="' + escapeHtml(item.standardHours) + '" disabled>' +
              '</div>' +
              '<button type="button" class="approve-btn" data-log-id="' + escapeHtml(item.logId) + '">Zatwierdź</button>' +
              '<div class="status" data-role="rowStatus"></div>' +
              '</div>';
          }).join("");
        }

        function syncPrzepracowaneInput(selectEl) {
          const logId = selectEl.dataset.logId;
          const input = pendingList.querySelector('.przepracowane-input[data-log-id="' + cssEscape(logId) + '"]');
          if (!input) return;

          if (selectEl.value === "TAK") {
            input.disabled = false;
            input.value = selectEl.dataset.raw;
          } else {
            input.disabled = true;
            input.value = selectEl.dataset.standard;
          }
        }

        function submitApproval(btn) {
          const logId = btn.dataset.logId;
          const item = btn.closest(".attendance-item");
          const select = item.querySelector(".nadgodziny-select");
          const input = item.querySelector(".przepracowane-input");
          const rowStatus = item.querySelector('[data-role="rowStatus"]');

          btn.disabled = true;
          rowStatus.textContent = "Zapisywanie...";
          rowStatus.className = "status";

          callApi("approveAttendance", {
            initData: initData,
            employeeId: empSelect.value,
            logId: logId,
            nadgodziny: select.value,
            przepracowane: input.value
          })
            .then(function (result) {
              if (result && result.ok) {
                rowStatus.textContent = result.message || "✅ Zatwierdzono";
                rowStatus.className = "status success";
                haptic("notification", "success");
                setTimeout(function () { loadPending(empSelect.value); }, 600);
                return;
              }

              rowStatus.textContent = "❌ " + ((result && result.error) || "Nie udało się zatwierdzić.");
              rowStatus.className = "status error";
              btn.disabled = false;
            })
            .catch(function () {
              rowStatus.textContent = "❌ Błąd połączenia z serwerem.";
              rowStatus.className = "status error";
              btn.disabled = false;
            });
        }

        function cssEscape(value) {
          return (value || "").toString().replace(/["\\]/g, "\\$&");
        }

        function submitEvent(type) {
          setLoading(true);
          setStatus("Rejestrowanie...", "");
          haptic("impact", "light");

          callApi("registerEvent", { type: type, initData: initData })
            .then(function (result) {
              if (result && result.ok) {
                const text = (result.message || "✅ Zapisano") + (result.time ? (" o " + result.time) : "");
                setStatus(text, "success");
                haptic("notification", "success");
                loadDashboard();
                return;
              }

              const errorText = result && result.error ? result.error : "Nie udało się zapisać zdarzenia.";
              setStatus("❌ " + errorText, "error");
              haptic("notification", "error");
            })
            .catch(function () {
              setStatus("❌ Błąd połączenia z serwerem.", "error");
              haptic("notification", "error");
            })
            .finally(function () {
              setLoading(false);
            });
        }

        function submitCorrection() {
          corrSubmitBtn.disabled = true;
          setCorrStatus("Wysyłanie...", "");

          callApi("submitCorrection", {
            initData: initData,
            date: corrDate.value,
            time: corrTime.value,
            note: corrNote.value
          })
            .then(function (result) {
              if (result && result.ok) {
                setCorrStatus(result.message || "✅ Wniosek wysłany", "success");
                haptic("notification", "success");
                correctionForm.reset();
                corrDate.value = new Date().toISOString().slice(0, 10);
                return;
              }

              const errorText = result && result.error ? result.error : "Nie udało się wysłać wniosku.";
              setCorrStatus("❌ " + errorText, "error");
              haptic("notification", "error");
            })
            .catch(function () {
              setCorrStatus("❌ Błąd połączenia z serwerem.", "error");
              haptic("notification", "error");
            })
            .finally(function () {
              corrSubmitBtn.disabled = false;
            });
        }

        function loadAvailability(month) {
          const requestParams = { initData: initData };
          if (month) requestParams.month = month;

          callApi("getAvailabilityData", requestParams)
            .then(function (result) {
              const availTabBtn = document.querySelector('.tab-btn[data-tab="dyspozycyjnosc"]');

              if (result && result.ok && result.enabled === false) {
                if (availTabBtn) availTabBtn.style.display = "none";
                const availTabContent = document.getElementById("tab-dyspozycyjnosc");
                if (availTabContent && availTabContent.classList.contains("active") && availTabBtn) {
                  availTabContent.classList.remove("active");
                  availTabBtn.classList.remove("active");
                  document.getElementById("tab-historia").classList.add("active");
                  document.querySelector('.tab-btn[data-tab="historia"]').classList.add("active");
                }
                return;
              }
              if (availTabBtn) availTabBtn.style.display = "";

              if (!result || !result.ok) {
                availCounter.textContent = "⚠️ " + ((result && result.error) || "Nie udało się pobrać danych.");
                availCounter.className = "status-badge idle";
                return;
              }

              availLimit = result.limit;

              if (!availMonth.dataset.loaded) {
                availMonth.innerHTML = result.months.map(function (m) {
                  return '<option value="' + m.value + '">' + escapeHtml(m.label) + '</option>';
                }).join("");
                availMonth.dataset.loaded = "1";
              }

              availMonth.value = result.selectedMonth;
              renderAvailabilityDays(result.days, result.selectedDays);
              updateAvailCounter();
            })
            .catch(function () {
              availCounter.textContent = "⚠️ Błąd połączenia z serwerem.";
              availCounter.className = "status-badge idle";
            });
        }

        function renderAvailabilityDays(days, selectedDays) {
          const selectedSet = new Set(selectedDays);

          availDaysList.innerHTML = days.map(function (d) {
            const checked = selectedSet.has(d.day) ? "checked" : "";
            return '<label class="list-item" style="cursor:pointer;">' +
              '<span class="label">' + d.day + ' (' + escapeHtml(d.dayName) + ')</span>' +
              '<input type="checkbox" class="avail-day-checkbox" value="' + d.day + '" ' + checked + '>' +
              '</label>';
          }).join("");

          document.querySelectorAll(".avail-day-checkbox").forEach(function (cb) {
            cb.addEventListener("change", updateAvailCounter);
          });
        }

        function updateAvailCounter() {
          const checkedCount = document.querySelectorAll(".avail-day-checkbox:checked").length;
          const remaining = availLimit - checkedCount;

          if (remaining < 0) {
            availCounter.className = "status-badge idle";
            availCounter.style.color = "#ff9ea0";
            availCounter.textContent = "⚠️ Za dużo! Odznacz jeszcze " + Math.abs(remaining) + " dni (limit: " + availLimit + ").";
          } else {
            availCounter.className = "status-badge idle";
            availCounter.style.color = "";
            availCounter.textContent = "Możesz jeszcze zaznaczyć: " + remaining + " z " + availLimit + " dni.";
          }
        }

        function submitAvailability() {
          const checkedDays = Array.from(document.querySelectorAll(".avail-day-checkbox:checked"))
            .map(function (cb) { return cb.value; });

          if (checkedDays.length > availLimit) {
            setAvailStatus("❌ Za dużo zaznaczonych dni. Odznacz jeszcze " + (checkedDays.length - availLimit) + ".", "error");
            return;
          }

          availSaveBtn.disabled = true;
          setAvailStatus("Zapisywanie...", "");

          callApi("submitAvailability", {
            initData: initData,
            month: availMonth.value,
            days: checkedDays.join(",")
          })
            .then(function (result) {
              if (result && result.ok) {
                setAvailStatus(result.message || "✅ Zapisano", "success");
                haptic("notification", "success");
                return;
              }

              setAvailStatus("❌ " + ((result && result.error) || "Nie udało się zapisać."), "error");
              haptic("notification", "error");
            })
            .catch(function () {
              setAvailStatus("❌ Błąd połączenia z serwerem.", "error");
              haptic("notification", "error");
            })
            .finally(function () {
              availSaveBtn.disabled = false;
            });
        }

        function setAvailStatus(message, className) {
          availStatus.textContent = message || "";
          availStatus.className = "status" + (className ? " " + className : "");
        }

        function loadDashboard() {
          callApi("getMiniAppDashboard", { initData: initData })
            .then(function (result) {
              if (!result || !result.ok) {
                setStatusBadge("idle", "⚠️ " + ((result && result.error) || "Nie udało się pobrać danych."));
                return;
              }

              if (result.employeeName) {
                employeeNameEl.textContent = "Cześć, " + result.employeeName + "!";
              }

              renderStatus(result.status || {});
              renderHistory(result.history || []);
              renderSchedule(result.schedule || []);
            })
            .catch(function () {
              setStatusBadge("idle", "⚠️ Błąd połączenia z serwerem.");
            });
        }

        function renderStatus(status) {
          if (status.working) {
            setStatusBadge("working", "🟢 W pracy od " + (status.lastEventTime || "?"));
            startBtn.disabled = true;
            stopBtn.disabled = false;
          } else {
            const suffix = status.lastEventTime ? (" (ostatnio: " + status.lastEventTime + ")") : "";
            setStatusBadge("idle", "⚪ Poza pracą" + suffix);
            startBtn.disabled = false;
            stopBtn.disabled = true;
          }
        }

        function renderHistory(history) {
          if (!history.length) {
            historyList.innerHTML = '<p class="empty-hint">Brak zarejestrowanych dni.</p>';
            return;
          }

          historyList.innerHTML = history.map(function (item) {
            const range = (item.start || "?").slice(0, 5) + " – " + (item.stop ? item.stop.slice(0, 5) : "trwa");
            const meta = item.approved
              ? ("✅ " + escapeHtml(item.przepracowane))
              : "⏳ oczekuje na zatwierdzenie";
            return '<div class="list-item">' +
              '<span class="label">' + escapeHtml(item.date) + ' · ' + escapeHtml(range) + '</span>' +
              '<span class="meta">' + meta + '</span>' +
              '</div>';
          }).join("");
        }

        function renderSchedule(schedule) {
          if (!schedule.length) {
            scheduleList.innerHTML = '<p class="empty-hint">Brak zaplanowanych dni.</p>';
            return;
          }

          scheduleList.innerHTML = schedule.map(function (item) {
            const icon = DAY_ICON[item.type] || "📌";
            const dayName = getDayName(item.date);
            const hours = (item.start && item.stop) ? (item.start.slice(0, 5) + " – " + item.stop.slice(0, 5)) : "";
            return '<div class="list-item">' +
              '<span class="label">' + icon + ' ' + escapeHtml(item.date) + (dayName ? (" (" + dayName + ")") : "") + '</span>' +
              '<span class="meta">' + escapeHtml(item.type) + (hours ? (" · " + escapeHtml(hours)) : "") + '</span>' +
              '</div>';
          }).join("");
        }

        function getDayName(dateStr) {
          const parsed = new Date(dateStr + "T00:00:00");
          if (isNaN(parsed.getTime())) return "";
          return DAY_NAMES[parsed.getDay()];
        }

        function callApi(action, extraParams) {
          const url = new URL(window.location.href);
          url.search = "";
          url.searchParams.set("action", action);
          Object.keys(extraParams).forEach(function (key) {
            url.searchParams.set(key, extraParams[key] == null ? "" : extraParams[key]);
          });

          return fetch(url.toString(), { method: "GET" }).then(function (response) {
            return response.json();
          });
        }

        function setLoading(loading) {
          if (loading) {
            startBtn.disabled = true;
            stopBtn.disabled = true;
          }
        }

        function setStatus(message, className) {
          statusEl.textContent = message || "";
          statusEl.className = "status" + (className ? " " + className : "");
        }

        function setCorrStatus(message, className) {
          corrStatus.textContent = message || "";
          corrStatus.className = "status" + (className ? " " + className : "");
        }

        function setStatusBadge(state, text) {
          statusBadge.textContent = text;
          statusBadge.className = "status-badge " + state;
        }

        function escapeHtml(value) {
          return (value == null ? "" : value.toString())
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function haptic(type, style) {
          if (!tg || !tg.HapticFeedback) return;

          if (type === "impact" && tg.HapticFeedback.impactOccurred) {
            tg.HapticFeedback.impactOccurred(style || "light");
          } else if (type === "notification" && tg.HapticFeedback.notificationOccurred) {
            tg.HapticFeedback.notificationOccurred(style || "success");
          }
        }

        function applyTelegramTheme(themeParams) {
          if (themeParams.bg_color) {
            document.documentElement.style.setProperty("--bg", themeParams.bg_color);
          }
          if (themeParams.secondary_bg_color) {
            document.documentElement.style.setProperty("--surface", themeParams.secondary_bg_color);
          }
          if (themeParams.text_color) {
            document.documentElement.style.setProperty("--text", themeParams.text_color);
          }
          if (themeParams.hint_color) {
            document.documentElement.style.setProperty("--hint", themeParams.hint_color);
          }
          if (themeParams.button_color) {
            document.documentElement.style.setProperty("--accent", themeParams.button_color);
          }
        }
      })();
    </script>
  </body>
