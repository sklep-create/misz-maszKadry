<style>
  :root {
    --bg: #17212b;
    --surface: #1f2a36;
    --surface-2: #26323f;
    --text: #ffffff;
    --hint: #8e9aa7;
    --accent: #2ea6ff;
    --start: #31c46c;
    --stop: #ff5a5f;
    --border: #33414f;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 40px;
  }

  .panel {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
  }

  .company-logo {
    display: block;
    max-height: 48px;
    max-width: 100%;
    margin: 0 auto 14px;
  }

  .company-logo[hidden] {
    display: none;
  }

  h1 {
    margin: 0 0 8px 0;
    font-size: 24px;
  }

  .subtitle {
    margin: 0 0 16px 0;
    color: var(--hint);
    font-size: 14px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 600;
  }

  .status-badge.working {
    color: #77f5a9;
  }

  .status-badge.idle {
    color: var(--hint);
  }

  .button-grid {
    display: grid;
    gap: 12px;
  }

  .big-btn {
    border: none;
    border-radius: 14px;
    padding: 18px 16px;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform .12s ease, filter .2s ease, opacity .2s ease;
  }

  .big-btn:active {
    transform: scale(0.98);
  }

  .big-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .start-btn {
    background: var(--start);
  }

  .stop-btn {
    background: var(--stop);
  }

  .status {
    margin-top: 14px;
    min-height: 22px;
    font-size: 14px;
  }

  .status.success {
    color: #77f5a9;
  }

  .status.error {
    color: #ff9ea0;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 22px 0 16px;
  }

  .avail-month-select {
    display: block;
    width: 100%;
    margin-top: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }

  .tab-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--hint);
    border-radius: 10px;
    padding: 10px 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .list {
    display: grid;
    gap: 8px;
  }

  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }

  .list-item .label {
    font-weight: 600;
  }

  .list-item .meta {
    color: var(--hint);
    text-align: right;
  }

  .empty-hint {
    color: var(--hint);
    font-size: 13px;
    text-align: center;
    padding: 14px 0;
  }

  .attendance-item {
    display: grid;
    gap: 8px;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
  }

  .attendance-item .row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .attendance-item .controls {
    display: flex;
    gap: 8px;
  }

  .attendance-item select,
  .attendance-item input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }

  .attendance-item select {
    flex: 1;
  }

  .attendance-item input {
    width: 70px;
  }

  .attendance-item .approve-btn {
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
  }

  .attendance-item .approve-btn:disabled {
    opacity: 0.5;
    cursor: wait;
  }

  .form {
    display: grid;
    gap: 14px;
  }

  .form label {
    display: grid;
    gap: 6px;
    font-size: 13px;
    color: var(--hint);
  }

  .form input,
  .form textarea {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }

  .form input:focus,
  .form textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .submit-btn {
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: wait;
  }
</style>
